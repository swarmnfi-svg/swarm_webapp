# Dev profile: file-based H2 database (persists across restarts)
server:
  address: 0.0.0.0

biopower:
  cors:
    # Allow LAN clients (Vite on :3000, or direct API calls from other PCs)
    allowed-origins: >-
      http://localhost:3000,
      http://localhost:5173,
      http://127.0.0.1:3000,
      http://192.168.*:3000,
      http://10.*:3000,
      http://172.16.*:3000

spring:
  datasource:
    url: jdbc:h2:file:./data/biopower_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

mqtt:
  enabled: false

logging:
  level:
    com.biopower: INFO
