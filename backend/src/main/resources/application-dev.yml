# Dev profile: file-based H2 database (persists across restarts)
spring:
  datasource:
    url: jdbc:h2:file:./data/biopower_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

mqtt:
  enabled: false

logging:
  level:
    com.biopower: INFO
