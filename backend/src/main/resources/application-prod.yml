spring:
  jpa:
    hibernate:
      # Standby (Railway) needs update after hourly Pi sync; override via env if needed.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

server:
  port: ${PORT:8080}

logging:
  level:
    com.biopower: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
