spring:
  application:
    name: biopower-monitoring
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:biopower_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:biopower}
    password: ${DB_PASSWORD:biopower123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:biopower-super-secret-key-change-in-production-min-256-bits-long!!}
  expiration: ${JWT_EXPIRATION:86400000}

mqtt:
  enabled: ${MQTT_ENABLED:true}
  broker-url: ${MQTT_BROKER:tcp://localhost:1883}
  client-id: biopower-server
  topic: biopower/sensors/#
  username: ${MQTT_USER:}
  password: ${MQTT_PASSWORD:}

biopower:
  identity:
    mode: ${IDENTITY_MODE:local}
    saas:
      accounts-url: ${SAAS_ACCOUNTS_URL:https://accounts.empowerapp.in}
      client-id: ${SAAS_CLIENT_ID:swarm_webapp}
      client-secret: ${SAAS_CLIENT_SECRET:}
      app-url: ${SAAS_APP_URL:http://localhost:3000}
      token-path: /api/oauth/token
  alert:
    ph-min: 6.5
    ph-max: 8.5
    temp-min: 25.0
    temp-max: 45.0
    pressure-max: 2.5
    sensor-timeout-minutes: 10
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.biopower: INFO
    org.springframework.security: WARN
