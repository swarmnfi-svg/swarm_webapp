services:
  mysql:
    image: mysql:8.0
    container_name: biopower-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: biopower_db
      MYSQL_USER: biopower
      MYSQL_PASSWORD: biopower123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: biopower-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./backend
    container_name: biopower-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: biopower_db
      DB_USER: biopower
      DB_PASSWORD: biopower123
      JWT_SECRET: biopower-production-secret-key-min-256-bits-change-me!!
      MQTT_BROKER: tcp://mosquitto:1883
      CORS_ORIGINS: http://localhost,http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: biopower-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
