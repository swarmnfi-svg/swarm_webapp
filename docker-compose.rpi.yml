# Raspberry Pi primary stack (arm64). Use with: docker compose -f docker-compose.rpi.yml up -d
# Copy .env.rpi.example to .env.rpi and set values before first start.

services:
  mysql:
    image: mysql:8.0
    platform: linux/arm64
    container_name: swarm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-biopower_db}
      MYSQL_USER: ${DB_USER:-biopower}
      MYSQL_PASSWORD: ${DB_PASSWORD:-biopower123}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      # Mount USB SSD path on Pi, e.g. /mnt/ssd/swarm/mysql
      - ${SWARM_MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M

  backend:
    build: ./backend
    platform: linux/arm64
    container_name: swarm-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-biopower_db}
      DB_USER: ${DB_USER:-biopower}
      DB_PASSWORD: ${DB_PASSWORD:-biopower123}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.rpi}
      MQTT_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://app.swarm.co.in,capacitor://localhost}
      IDENTITY_MODE: ${IDENTITY_MODE:-saas}
      SAAS_ACCOUNTS_URL: ${SAAS_ACCOUNTS_URL:-https://accounts.empowerapp.in}
      SAAS_CLIENT_ID: ${SAAS_CLIENT_ID:-swarm_webapp}
      SAAS_APP_URL: ${SAAS_APP_URL:-https://app.swarm.co.in}
      SWARM_PUBLIC_API_URL: ${SWARM_PUBLIC_API_URL:?Set SWARM_PUBLIC_API_URL in .env.rpi}
      SWARM_DEPLOYMENT_ROLE: primary
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms128m -Xmx384m"
      SENSOR_RETENTION_DAYS: ${SENSOR_RETENTION_DAYS:-30}
      NOVA_SPACE_OP_ENABLED: ${NOVA_SPACE_OP_ENABLED:-true}
      NOVA_THINK_ENABLED: ${NOVA_THINK_ENABLED:-true}
      NOVA_NARRATE_ENABLED: ${NOVA_NARRATE_ENABLED:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env.rpi}
    platform: linux/arm64
    container_name: swarm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:8080"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
